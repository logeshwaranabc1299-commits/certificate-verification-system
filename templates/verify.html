<!DOCTYPE html>
<html>
<head>
    <title>Verify Certificate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h2>Verify Certificate</h2>

    <form method="POST">

        <label>Certificate ID</label>

        <input
            type="text"
            name="certificate_id"
            placeholder="Enter Certificate ID"
            required
        >

        <br><br>

        <button type="submit">
            Verify Certificate
        </button>

    </form>

</div>

</body>
</html>
